
name: SwagLabs CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      userdb:
        image: postgres:17
        env:
          POSTGRES_USER: nikita
          POSTGRES_DB: qa_shop
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nikita -d qa_shop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      composedb:
        image: postgres:17
        env:
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: qa_pass
          POSTGRES_DB: qa_shop_compose
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U qa_user -d qa_shop_compose"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Initialize user database
        run: |
          docker exec -i "${{ job.services.userdb.id }}" \
            psql -U nikita -d qa_shop \
            -f - < .github/db-init/qa_shop.sql

      - name: Run tests
        run: mvn -B -Dheadless=true clean test

      - name: Generate test report
        if: always()
        run: |
          if [ -d target/surefire-reports ] && compgen -G "target/surefire-reports/TEST-*.xml" > /dev/null; then
            mvn -B test-compile exec:java
          else
            echo "No Surefire XML reports found"
            exit 1
          fi

      - name: Commit updated README
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update test results in README"
            git push
          else
            echo "README has no changes"
          fi


